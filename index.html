<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKQA - Welcome Page on Github Pages</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('./images/generated/forest_1.png') no-repeat center center/cover;
            z-index: -1;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .slideshow {
            display: flex;
            gap: 20px;
            max-width: 80%;
        }
        .slideshow img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border: 2px solid white;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        .slideshow img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="container">
        <h1>Discover</h1>
        <div class="slideshow">
            <img src="./images/generated/img_0.png" alt="road as a data pipeline">
            <img src="./images/generated/example_1795612001/img_3.png" alt="exploration">
            <img src="./images/generated/example_1795612775/img_8.png" alt="find your way">
        </div>
    </div>
</body>
</html>
